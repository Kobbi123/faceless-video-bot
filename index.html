<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoShorts Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Header & Config -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900 p-6 rounded-2xl border border-slate-800">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">AutoShorts Studio</h1>
        <p class="text-sm text-slate-400">Automate your faceless viral videos 🚀</p>
      </div>
      <div class="w-full md:w-auto">
        <label class="block text-xs text-slate-400 mb-1">Render Server URL</label>
        <input id="serverUrl" type="text" value="https://autoshorts-backend-8m5z.onrender.com" class="w-full md:w-80 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
      </div>
    </div>

    <!-- Generator Form -->
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Video Topic / Script Prompt</label>
        <textarea id="promptInput" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-purple-500" placeholder="e.g. 3 mind-blowing facts about space..."></textarea>
      </div>

      <button id="generateBtn" onclick="generateVideo()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold py-3 rounded-xl transition-all flex items-center justify-center gap-2">
        <span>✨ Generate Video Series</span>
      </button>
    </div>

    <!-- Status & Output -->
    <div id="statusBox" class="hidden bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center space-y-4">
      <div id="loadingSpinner" class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-500 border-t-transparent"></div>
      <p id="statusText" class="text-sm text-slate-300">Connecting to render engine...</p>
      <video id="videoPlayer" controls class="hidden w-full max-w-xs mx-auto rounded-xl border border-slate-700 shadow-2xl mt-4"></video>
    </div>

  </div>

  <script>
    async function generateVideo() {
      const rawUrl = document.getElementById('serverUrl').value.trim();
      const prompt = document.getElementById('promptInput').value.trim();
      const statusBox = document.getElementById('statusBox');
      const statusText = document.getElementById('statusText');
      const spinner = document.getElementById('loadingSpinner');
      const videoPlayer = document.getElementById('videoPlayer');

      // Clean brackets if any remain
      const serverUrl = rawUrl.replace(/^\[|\]$/g, '');

      if (!prompt) {
        alert('Please enter a topic or prompt!');
        return;
      }

      statusBox.classList.remove('hidden');
      spinner.classList.remove('hidden');
      videoPlayer.classList.add('hidden');
      statusText.textContent = 'Generating video... (First run on free tier may take 45s)';

      try {
        const response = await fetch(`${serverUrl}/generate-short`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt })
        });

        const data = await response.json();

        if (data.status === 'success') {
          spinner.classList.add('hidden');
          statusText.textContent = 'Video generated successfully! 🎉';
          videoPlayer.src = `${serverUrl}${data.video_url}`;
          videoPlayer.classList.remove('hidden');
          videoPlayer.play();
        } else {
          throw new Error(data.error || 'Failed to generate video');
        }
      } catch (err) {
        spinner.classList.add('hidden');
        statusText.textContent = `Error: ${err.message}`;
        alert(`Could not connect to Render server at: ${serverUrl}\n\nError: ${err.message}`);
      }
    }
  </script>
</body>
</html>
